  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background-color: #000000;
      font-family: Arial, sans-serif;

      overflow-x: hidden;
      overflow-y: auto;

      scroll-behavior: smooth;
    }


    /* =========================================================
       GAST LOADING SCREEN
       ========================================================= */

    #site-loader {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100vh;

      background: #0D0F14;

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 99999;

      opacity: 1;
      visibility: visible;

      transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
    }

    #site-loader.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-content {
      text-align: center;
    }

    .loader-title {
      color: #00FF87;

      font-family:
        "Arial Black",
        Arial,
        sans-serif;

      font-size: clamp(3rem, 8vw, 6rem);

      font-weight: 900;

      letter-spacing: 8px;

      margin-bottom: 10px;
    }

    .loader-subtitle {
      color: #ffffff;

      font-family:
        Arial,
        sans-serif;

      font-size: 0.75rem;

      letter-spacing: 4px;

      opacity: 0.75;
    }

    .loader-dots {
      display: flex;

      justify-content: center;

      gap: 8px;

      margin-top: 22px;
    }

    .loader-dots span {
      width: 7px;
      height: 7px;

      background: #00FF87;

      border-radius: 50%;

      animation:
        loaderPulse 1.2s
        infinite ease-in-out;
    }

    .loader-dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .loader-dots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes loaderPulse {

      0%,
      80%,
      100% {
        opacity: 0.25;
        transform: scale(0.7);
      }

      40% {
        opacity: 1;
        transform: scale(1);
      }

    }


    /* =========================================================
       NAVIGATION
       ========================================================= */

    .cinema-navbar {
      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 90px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 0 4%;

      z-index: 1000;

      background:
        linear-gradient(
          to bottom,
          rgba(5, 5, 5, 0.8) 0%,
          rgba(5, 5, 5, 0) 100%
        );

      pointer-events: none;
    }

    .brand-logo {
      height: 50px;

      display: flex;
      align-items: center;

      pointer-events: auto;
    }

    .brand-logo img {
      height: 100%;
      width: 600%;

      object-fit: contain;

      transform:
        scale(4.3)
        translateY(3px)
        translateX(20px);
    }

    .nav-links-menu {
      display: flex;

      gap: 55px;

      list-style: none;

      pointer-events: auto;

      transform:
        translateY(-20px)
        translateX(-1px);
    }

    .nav-item {
      text-decoration: none;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Inter,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 1.2rem;
      font-weight: 700;

      letter-spacing: 2px;

      text-transform: uppercase;

      color: #e5e5e5;

      position: relative;

      padding: 4px 0;

      transition: color 0.2s ease;
    }

    .nav-item:hover {
      color: #00ff87;
    }

    .nav-item::after {
      content: '';

      position: absolute;

      bottom: 0;
      left: 0;

      width: 100%;
      height: 2px;

      background-color: #00ff87;

      transform: scaleX(0);

      transform-origin: right;

      transition:
        transform 0.3s
        cubic-bezier(0.45, 0, 0.55, 1);
    }

    .nav-item:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }


    /* =========================================================
       GENERAL PAGE SECTIONS
       ========================================================= */

    .cinema-page-section {
      position: relative;

      width: 100vw;
      height: 100vh;

      overflow: hidden;

      background-color: #000000;
    }


    /* =========================================================
       PAGE 1 - VIDEO CAROUSEL
       ========================================================= */

    .carousel-container {
      width: 100%;
      height: 100%;

      position: relative;
    }

    .marquee-slide-wrapper {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 1s ease-in-out,
        visibility 1s ease-in-out;

      z-index: 1;
    }

    .marquee-slide-wrapper.active-slide {
      opacity: 1;
      visibility: visible;

      z-index: 2;
    }

    .marquee-slide-wrapper video {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .text-overlay-wrapper {
      position: absolute;

      bottom: 10%;
      left: 6%;

      color: #ffffff;

      z-index: 10;

      text-shadow:
        0 4px 12px rgba(0, 0, 0, 0.9);

      pointer-events: none;
    }

    .slide-info-card {
      position: absolute;

      bottom: 0;
      left: 0;

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 0.8s ease-in-out;

      width: 600px;
    }

    .slide-info-card.active-text {
      position: relative;

      opacity: 1;
      visibility: visible;
    }

    .slide-info-card h1 {
      font-size: 3.5rem;

      font-weight: 800;

      text-transform: uppercase;

      margin-bottom: 0.5rem;
    }

    .slide-info-card p {
      font-size: 1.2rem;

      color: #e0e0e0;

      letter-spacing: 1px;
    }

    .carousel-container::after {
      content: '';

      position: absolute;

      bottom: 0;
      left: 0;

      width: 100%;
      height: 35%;

      background:
        linear-gradient(
          to top,
          rgba(0, 0, 0, 0.95) 0%,
          rgba(0, 0, 0, 0) 100%
        );

      z-index: 5;

      pointer-events: none;
    }


    /* =========================================================
       SPLINE SECTIONS
       ========================================================= */

    .spline-inner-div {
      position: relative;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background-color: #000000;
    }

    .spline-container {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      opacity: 0;

      transition:
        opacity 0.35s ease;

      pointer-events: none;
    }

    .spline-container.active {
      opacity: 1;

      pointer-events: auto;
    }

    spline-viewer {
      display: block;

      width: 100%;
      height: 100%;

      touch-action: pan-y;
    }


    /* =========================================================
       SPLINE LOGO HIDER
       ========================================================= */

    .spline-logo-hider-box {
      position: absolute;

      bottom: 0;
      right: 0;

      width: 170px;
      height: 58px;

      background-color: #0D0F14;

      z-index: 99;

      pointer-events: auto;
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 768px) {

      .cinema-navbar {
        height: 70px;

        padding: 0 4%;

        background:
          rgba(0, 0, 0, 0.85);
      }

      .brand-logo {
        height: 32px;
      }

      .nav-links-menu {
        gap: 12px;
      }

      .nav-item {
        font-size: 0.65rem;

        letter-spacing: 1px;
      }

    }


    /* =========================================================
       SCHEDULE
       ========================================================= */

    .cinema-schedule {

      width: 100%;

      height: 100vh;

      min-height: 600px;

      position: relative;

      background-image:
        url("Schedule.jpg");

      background-size: cover;

      background-position:
        left center;

      background-repeat: no-repeat;
    }

    .cinema-schedule-btn {

      position: absolute;

      right: 18%;

      top: 50%;

      transform:
        translateY(-50%);

      display: flex;

      align-items: center;

      justify-content: center;

      padding:
        15px 32px;

      background: #087fc1;

      color: #fff;

      text-decoration: none;

      font-family:
        Arial,
        sans-serif;

      font-size: 18px;

      font-weight: 600;

      border-radius: 8px;

      box-shadow:
        0 6px 20px
        rgba(0, 0, 0, 0.35);

      transition:
        0.25s ease;
    }

    .cinema-schedule-btn:hover {

      background: #0a9be8;

      transform:
        translateY(-50%)
        scale(1.05);
    }


    /* =========================================================
       TABLET
       ========================================================= */

    @media (max-width: 1000px) {

      .cinema-schedule-btn {

        right: 5%;

        padding:
          13px 26px;

        font-size: 16px;
      }

    }


    /* =========================================================
       PHONE
       ========================================================= */

    @media (max-width: 600px) {

      .cinema-schedule {

        min-height: 500px;

        background-position:
          28% center;
      }

      .cinema-schedule-btn {

        right: 5%;

        transform: none;

        padding:
          12px 22px;

        font-size: 15px;
      }

      .cinema-schedule-btn:hover {

        transform:
          scale(1.05);
      }

    }

  </style>

  <script>


    /* =========================================================
       VIDEO CAROUSEL
       ========================================================= */

    const videoSlides =
      document.querySelectorAll(
        '.marquee-slide-wrapper'
      );

    let currentActiveIndex = 0;

    const slideDurationInterval =
      30000;


    setInterval(() => {


      /*
        Pause current video.
      */

      const outgoingVideo =
        videoSlides[currentActiveIndex]
          .querySelector('video');

      if (outgoingVideo) {

        outgoingVideo.pause();

      }


      /*
        Remove old slide classes.
      */

      document
        .getElementById(
          `wrapper-${currentActiveIndex}`
        )
        .classList
        .remove('active-slide');


      document
        .getElementById(
          `text-${currentActiveIndex}`
        )
        .classList
        .remove('active-text');


      /*
        Move to next slide.
      */

      currentActiveIndex =
        (currentActiveIndex + 1)
        % videoSlides.length;


      /*
        Activate new slide.
      */

      document
        .getElementById(
          `wrapper-${currentActiveIndex}`
        )
        .classList
        .add('active-slide');


      document
        .getElementById(
          `text-${currentActiveIndex}`
        )
        .classList
        .add('active-text');


      /*
        Restart new video.
      */

      const incomingVideo =
        videoSlides[currentActiveIndex]
          .querySelector('video');

      if (incomingVideo) {

        incomingVideo.currentTime = 0;

        incomingVideo
          .play()
          .catch(err => {

            console.log(
              "Waiting for user interaction",
              err
            );

          });

      }

    }, slideDurationInterval);



    /* =========================================================
       VIDEO AUDIO ACTIVATION
       ========================================================= */

    document.body.addEventListener(
      'click',
      () => {

        videoSlides.forEach(
          slide => {

            const videoElement =
              slide.querySelector(
                'video'
              );

            if (videoElement) {

              videoElement.muted = false;

            }

          }

        );

      },
      {
        once: true
      }
    );



    /* =========================================================
       SPLINE SYSTEM
       ========================================================= */

    const splineSections =
      document.querySelectorAll(
        '.spline-section'
      );


    function loadSpline(section) {

      const container =
        section.querySelector(
          '.spline-container'
        );

      const splineURL =
        section.dataset.splineUrl;


      if (!container || !splineURL) {

        return;

      }


      /*
        Don't create another viewer
        if one already exists.
      */

      if (
        container.querySelector(
          'spline-viewer'
        )
      ) {

        return;

      }


      /*
        Create Spline viewer.
      */

      const viewer =
        document.createElement(
          'spline-viewer'
        );


      viewer.setAttribute(
        'url',
        splineURL
      );


      viewer.setAttribute(
        'loading-anim-type',
        'spinner-big-light'
      );


      container.appendChild(
        viewer
      );


      container.classList.add(
        'active'
      );

    }



    /* =========================================================
       LOAD BOTH SPLINE SCENES
       ========================================================= */

    splineSections.forEach(
      section => {

        loadSpline(section);

      }
    );



    /* =========================================================
       LOADING SCREEN
       ========================================================= */

    window.addEventListener(
      'load',
      () => {

        /*
          Give the browser time to render
          the initial page and begin loading
          the Spline scenes.
        */

        setTimeout(() => {

          const loader =
            document.getElementById(
              'site-loader'
            );

          if (loader) {

            loader.classList.add(
              'loaded'
            );

          }

        }, 1200);

      }
    );


  </script>
