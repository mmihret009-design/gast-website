<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GAST Dining</title>

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="shortcut icon" type="image/png" href="favicon.png">

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;

            background: #0d0f15;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            overflow-x: hidden;
            overflow-y: auto;
        }


        /* =====================================================
           NAVIGATION — FROM YOUR ORIGINAL FILE
        ===================================================== */

        .games-navbar {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;

            height: 90px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 0 4%;

            z-index: 1000;

            background:
                linear-gradient(
                    to bottom,
                    rgba(5,5,5,.85) 0%,
                    rgba(5,5,5,0) 100%
                );

            pointer-events: none;
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .brand-logo {

            display: flex;

            align-items: center;

            pointer-events: auto;

            text-decoration: none;
        }


        .brand-logo-text {

            font-size: 1.55rem;

            font-weight: 900;

            letter-spacing: -1px;

            color: #fff;

            text-transform: uppercase;

            line-height: 1;

            transition:
                transform .3s ease,
                text-shadow .3s ease;
        }


        .brand-logo-text span {

            font-weight: 400;

            color: #777;

            margin-left: 5px;
        }


        .brand-logo:hover .brand-logo-text {

            transform:
                scale(1.04);

            text-shadow:
                0 0 20px
                rgba(255,255,255,.35);
        }


        /* =====================================================
           NAV LINKS
        ===================================================== */

        .nav-links-menu {

            display: flex;

            gap: 55px;

            list-style: none;

            pointer-events: auto;

            transform:
                translateY(-20px)
                translateX(-1px);
        }


        .nav-item {

            text-decoration: none;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Inter,
                Helvetica,
                Arial,
                sans-serif;

            font-size: 1.2rem;

            font-weight: 700;

            letter-spacing: 2px;

            text-transform: uppercase;

            color: #e5e5e5;

            position: relative;

            padding: 4px 0;

            transition:
                color .2s ease;
        }


        .nav-item:hover {

            color: #ffffff;
        }


        .nav-item::after {

            content: "";

            position: absolute;

            bottom: 0;
            left: 0;

            width: 100%;

            height: 2px;

            background: #ffffff;

            transform:
                scaleX(0);

            transform-origin: right;

            transition:
                transform .3s
                cubic-bezier(
                    .45,
                    0,
                    .55,
                    1
                );
        }


        .nav-item:hover::after {

            transform:
                scaleX(1);

            transform-origin: left;
        }


        /* =====================================================
           DINING SECTION
        ===================================================== */

        .dining-section {

            min-height: 100vh;

            padding:
                140px 4vw
                100px;

            display: flex;

            flex-direction: column;

            align-items: center;
        }


        /* =====================================================
           TITLE
        ===================================================== */

        .dining-heading {

            text-align: center;

            margin-bottom: 65px;

            color: white;
        }


        .dining-heading h1 {

            font-family:
                Georgia,
                serif;

            font-size:
                clamp(3rem, 6vw, 6rem);

            letter-spacing: 5px;

            font-weight: 700;
        }


        .dining-heading p {

            margin-top: 10px;

            font-size:
                clamp(.7rem, 1vw, 1rem);

            letter-spacing: 4px;

            color: #aaa;

            text-transform: uppercase;
        }


        /* =====================================================
           CARD AREA
        ===================================================== */

        .cards-container {

            width: 100%;

            max-width: 1400px;

            display: flex;

            justify-content: center;

            align-items: center;

            gap:
                clamp(15px, 3vw, 45px);

            perspective: 1800px;
        }


        /* =====================================================
           CARD
           
           menu.jpg = 964 x 1536
           
           This establishes the physical size of every card.
        ===================================================== */

        .menu-card {

            position: relative;

            width:
                min(29vw, 390px);

            aspect-ratio:
                964 / 1536;

            flex-shrink: 0;

            cursor: pointer;

            transform-style: preserve-3d;

            z-index: 1;
        }


        /* =====================================================
           CARD POSITIONS
        ===================================================== */

        .menu-card:nth-child(1) {

            transform:
                rotate(-7deg)
                translateY(25px);
        }


        .menu-card:nth-child(2) {

            transform:
                rotate(0deg)
                translateY(-15px);

            z-index: 3;
        }


        .menu-card:nth-child(3) {

            transform:
                rotate(7deg)
                translateY(25px);
        }


        /* =====================================================
           FLIP INNER
        ===================================================== */

        .card-inner {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            transform-style:
                preserve-3d;

            /*
                Slightly slower than before.
            */

            transition:
                transform 1.35s
                cubic-bezier(
                    .2,
                    .75,
                    .2,
                    1
                );
        }


        .menu-card.flipped
        .card-inner {

            transform:
                rotateY(180deg);
        }


        /* =====================================================
           CARD FACES
        ===================================================== */

        .card-face {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;

            background-image:
                url("menu.jpg");

            background-size:
                100% 100%;

            background-position:
                center;

            background-repeat:
                no-repeat;

            box-shadow:
                0 25px 60px
                rgba(0,0,0,.55);
        }


        /* =====================================================
           FRONT
        ===================================================== */

        .card-front {

            position: absolute;
        }


        /*
           Your foods/drinks/desserts PNGs are NOT the card.

           They sit on top of menu.jpg.
        */

        .front-art {

            position: absolute;

            z-index: 2;

            width: 90%;

            height: 62%;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            object-fit: contain;

            object-position: center;

            filter:
                drop-shadow(
                    0 15px 15px
                    rgba(0,0,0,.35)
                );
        }


        /* =====================================================
           FRONT TEXT
        ===================================================== */

        .front-text {

            position: absolute;

            left: 10%;
            right: 10%;

            bottom: 9%;

            z-index: 5;

            text-align: center;

            color: white;
        }


        .front-text h2 {

            font-family:
                Georgia,
                serif;

            font-size:
                clamp(
                    1.3rem,
                    2.3vw,
                    2rem
                );

            letter-spacing: 4px;

            margin-bottom: 7px;
        }


        .front-text p {

            font-size:
                clamp(
                    .6rem,
                    .9vw,
                    .8rem
                );

            line-height: 1.5;

            color: #d0d0d0;
        }


        /* =====================================================
           BACK
        ===================================================== */

        .card-back {

            transform:
                rotateY(180deg);
        }


        /*
           IMPORTANT:

           The back PNG stays INSIDE the exact same
           964 / 1536 card dimensions.

           It cannot change the physical size of the card.
        */

        .back-art {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            object-position: center;

            z-index: 2;
        }


        /* =====================================================
           FLIP HINT
        ===================================================== */

        .flip-hint {

            position: absolute;

            z-index: 10;

            bottom: 3.5%;

            left: 50%;

            transform:
                translateX(-50%);

            color: rgba(255,255,255,.45);

            font-size: 8px;

            letter-spacing: 2px;

            white-space: nowrap;
        }


        /* =====================================================
           HOVER
        ===================================================== */

        @media (min-width: 901px) {

            .menu-card:nth-child(1):hover {

                transform:
                    rotate(-3deg)
                    translateY(-5px)
                    scale(1.035);
            }


            .menu-card:nth-child(2):hover {

                transform:
                    rotate(0deg)
                    translateY(-30px)
                    scale(1.045);
            }


            .menu-card:nth-child(3):hover {

                transform:
                    rotate(3deg)
                    translateY(-5px)
                    scale(1.035);
            }

        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 900px) {

            .nav-links-menu {

                gap: 18px;
            }


            .nav-item {

                font-size: .75rem;

                letter-spacing: 1px;
            }


            .brand-logo-text {

                font-size: 1.15rem;
            }


            .cards-container {

                flex-wrap: wrap;

                gap: 35px;
            }


            .menu-card {

                width:
                    min(42vw, 350px);
            }


            .menu-card:nth-child(1),
            .menu-card:nth-child(2),
            .menu-card:nth-child(3) {

                transform:
                    rotate(0deg)
                    translateY(0);
            }

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .games-navbar {

                height: 70px;

                padding: 0 4%;

                background:
                    rgba(0,0,0,.85);
            }


            .brand-logo-text {

                font-size: 1rem;
            }


            .nav-links-menu {

                gap: 12px;

                transform:
                    translateY(-10px);
            }


            .nav-item {

                font-size: .65rem;

                letter-spacing: 1px;
            }


            .dining-section {

                padding-top: 110px;
            }


            .dining-heading {

                margin-bottom: 45px;
            }


            .cards-container {

                flex-direction: column;

                gap: 45px;
            }


            .menu-card {

                width:
                    min(82vw, 390px);
            }


            .menu-card:nth-child(1),
            .menu-card:nth-child(2),
            .menu-card:nth-child(3) {

                transform:
                    rotate(0deg)
                    translateY(0);
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     YOUR ORIGINAL GAST NAVBAR
===================================================== -->

<nav class="games-navbar">

    <a
        href="dining.html"
        class="brand-logo"
    >

        <div class="brand-logo-text">

            GAST
            <span>DINING</span>

        </div>

    </a>


    <ul class="nav-links-menu">

        <li>
            <a
                href="INDEX.HTML"
                class="nav-item"
            >
                Home
            </a>
        </li>


        <li>
            <a
                href="cinema.html"
                class="nav-item"
            >
                Cinema
            </a>
        </li>


        <li>
            <a
                href="games.html"
                class="nav-item"
            >
                Games
            </a>
        </li>


        <li>
            <a
                href="dining.html"
                class="nav-item"
            >
                Dining
            </a>
        </li>


        <li>
            <a
                href="https://gym.gastmall.net/"
                class="nav-item"
            >
                Gym
            </a>
        </li>


        <li>
            <a
                href="developers.html"
                class="nav-item"
            >
                Developers
            </a>
        </li>

    </ul>

</nav>


<!-- =====================================================
     DINING
===================================================== -->

<section class="dining-section">


    <div class="dining-heading">

        <h1>GAST DINING</h1>

        <p>
            Where Every Floor Has A Flavour
        </p>

    </div>


    <div class="cards-container">


        <!-- =================================================
             FOOD
        ================================================== -->

        <div class="menu-card">

            <div class="card-inner">


                <!-- FRONT -->

                <div class="card-face card-front">

                    <img
                        src="foods.png"
                        class="front-art"
                        alt="Food"
                    >


                    <div class="front-text">

                        <h2>FOOD</h2>

                        <p>
                            Fresh flavours,
                            unforgettable bites.
                        </p>

                    </div>


                    <div class="flip-hint">
                        CLICK TO FLIP
                    </div>

                </div>


                <!-- BACK -->

                <div class="card-face card-back">

                    <img
                        src="foodback.png"
                        class="back-art"
                        alt="Food menu"
                    >

                </div>

            </div>

        </div>



        <!-- =================================================
             DRINKS
        ================================================== -->

        <div class="menu-card">

            <div class="card-inner">


                <!-- FRONT -->

                <div class="card-face card-front">

                    <img
                        src="drinks.png"
                        class="front-art"
                        alt="Drinks"
                    >


                    <div class="front-text">

                        <h2>DRINKS</h2>

                        <p>
                            Refresh.
                            Sip. Enjoy.
                        </p>

                    </div>


                    <div class="flip-hint">
                        CLICK TO FLIP
                    </div>

                </div>


                <!-- BACK -->

                <div class="card-face card-back">

                    <img
                        src="drinkback.png"
                        class="back-art"
                        alt="Drinks menu"
                    >

                </div>

            </div>

        </div>



        <!-- =================================================
             DESSERTS
        ================================================== -->

        <div class="menu-card">

            <div class="card-inner">


                <!-- FRONT -->

                <div class="card-face card-front">

                    <img
                        src="desserts.png"
                        class="front-art"
                        alt="Desserts"
                    >


                    <div class="front-text">

                        <h2>DESSERTS</h2>

                        <p>
                            Sweet endings
                            worth remembering.
                        </p>

                    </div>


                    <div class="flip-hint">
                        CLICK TO FLIP
                    </div>

                </div>


                <!-- BACK -->

                <div class="card-face card-back">

                    <img
                        src="dessertback.png"
                        class="back-art"
                        alt="Dessert menu"
                    >

                </div>

            </div>

        </div>


    </div>

</section>


<script>

    /* =====================================================
       CARD FLIPPING
    ===================================================== */

    const cards =
        document.querySelectorAll(".menu-card");


    cards.forEach(card => {

        card.addEventListener("click", () => {

            card.classList.toggle("flipped");

        });

    });

</script>


</body>
</html>
